name: Test cask

# Installs the cask on a throwaway macOS runner (a clean Homebrew prefix), so nobody's own
# Homebrew is touched. Runs on every push to Casks/ and by hand.
on:
  push:
    paths: ['Casks/**', '.github/workflows/test-cask.yml']
  pull_request:
    paths: ['Casks/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lmux:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4
      # Exactly what the README tells people to run, on a clean runner (taps from GitHub).
      - run: brew install --cask sooftware/tap/lmux
      # Then lint this checkout's cask.
      - name: Point the tap at this checkout
        run: |
          TAP="$(brew --repository)/Library/Taps/sooftware/homebrew-tap"
          git -C "$TAP" fetch -q "$GITHUB_WORKSPACE" HEAD && git -C "$TAP" checkout -q FETCH_HEAD
      - run: brew style --cask sooftware/tap/lmux
      - run: brew audit --cask --strict --online sooftware/tap/lmux
      - name: Installed app and CLI
        run: |
          test -d /Applications/lmux.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/lmux.app/Contents/Info.plist
          codesign --verify --deep --strict /Applications/lmux.app
          spctl -a -vv /Applications/lmux.app
          xcrun stapler validate /Applications/lmux.app
          command -v lmux
      - run: brew uninstall --cask --zap sooftware/tap/lmux
